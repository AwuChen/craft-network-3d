<head>
  <style>
    body { margin: 0; }
    @media (max-width: 768px) {
      body {
        font-size: 40px;
      }
      #info-panel {
        font-size: 40px;
      }
    }
    #info-panel {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px;
      background-color: white;
      border: 1px solid black;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.3);
      z-index: 1000;
      display: none;
      text-align: center;
    }
    #info-panel button {
      margin-top: 10px;
    }
    #status-banner {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #ccc;
      border-radius: 4px;
      font: 14px/1.4 sans-serif;
      z-index: 1001;
      display: none;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/3d-force-graph"></script>
</head>

<body>
  <div id="status-banner">Loading network…</div>
  <div id="3d-graph"></div>
  <div id="info-panel"></div>

  <script>
    const DATA_SOURCES = [
      'graph-data.json',
      'https://awuchen.github.io/craft-network/graph-data.json',
    ];

    function showStatus(message) {
      const banner = document.getElementById('status-banner');
      banner.textContent = message;
      banner.style.display = message ? 'block' : 'none';
    }

    function nodeLabel(node) {
      const text = node.title || node.role || 'N/A';
      return window.innerWidth <= 768
        ? `<div style="font-size: 40px;">${text}</div>`
        : text;
    }

    function sanitizeGraph(payload) {
      const nodes = (payload.nodes || []).filter((n) => n && n.id);
      const nodeIds = new Set(nodes.map((n) => n.id));
      const links = (payload.links || []).filter(
        (l) => l && l.source && l.target && nodeIds.has(l.source) && nodeIds.has(l.target)
      );
      return { nodes, links };
    }

    function renderGraph(gData) {
      const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
        .graphData(gData)
        .nodeLabel(nodeLabel)
        .onNodeHover(node => {
          Graph.nodeLabel(node ? nodeLabel : (n => n.role || 'N/A'));
        })
        .onNodeClick(node => {
          const infoPanel = document.getElementById('info-panel');
          infoPanel.innerHTML = `
            <h3>Network Info</h3>
            <p><strong>Name:</strong> ${node.name}</p>
            <p><strong>Title:</strong> ${node.title || 'N/A'}</p>
            <p><strong>Role:</strong> ${node.role || 'N/A'}</p>
            <p><strong>Website:</strong> ${node.website && node.website !== '' ? `<a href="${node.website}" target="_blank" rel="noopener noreferrer">${node.website.length > 30 ? `${node.website.substring(0, 30)}...` : node.website}</a>` : ''}</p>
            <button onclick="document.getElementById('info-panel').style.display='none'">Close</button>
          `;
          infoPanel.style.display = 'block';
        });

      showStatus('');
      return Graph;
    }

    async function loadGraphData() {
      let lastError = null;

      for (const source of DATA_SOURCES) {
        try {
          const response = await fetch(source, { cache: 'no-cache' });
          if (!response.ok) {
            throw new Error(`${source} returned ${response.status}`);
          }
          const payload = await response.json();
          if (!payload.nodes || !payload.links) {
            throw new Error(`${source} missing nodes/links`);
          }
          return payload;
        } catch (error) {
          lastError = error;
          console.warn('Graph data source failed:', source, error);
        }
      }

      throw lastError || new Error('No graph data sources available');
    }

    showStatus('Loading network…');
    loadGraphData()
      .then(payload => {
        const gData = sanitizeGraph(payload);
        renderGraph(gData);
        console.log(`Loaded ${gData.nodes.length} nodes, ${gData.links.length} links`);
      })
      .catch(error => {
        console.error('Error loading graph:', error);
        showStatus('Could not load network data. Run craft-network export-3d-graph or check Neo4j keep-alive.');
      });
  </script>
</body>
